services:
  - type: web
    name: cordial-api
    runtime: docker
    dockerfilePath: cordial/backend/Dockerfile
    dockerContext: cordial/backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Cordial API
      - key: ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cordial
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 10080
      - key: FRONTEND_ORIGINS
        value: https://cordial-web.onrender.com
      - key: SHOW_DEV_OTP
        value: true
      - key: OTP_REQUEST_LIMIT
        value: 5
      - key: OTP_VERIFY_LIMIT
        value: 10
      - key: OTP_RATE_WINDOW_MINUTES
        value: 15
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Cordial
      - key: SMTP_USE_TLS
        value: true

  - type: web
    name: cordial-web
    runtime: static
    buildCommand: cd cordial/frontend && npm ci && npm run build
    staticPublishPath: cordial/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://cordial-api.onrender.com
